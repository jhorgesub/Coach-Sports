spring.application.name=gym-app

# ============================================================
# Datasource — PostgreSQL
# Las variables de entorno son inyectadas por Docker Compose.
# Los valores por defecto (después del ":") son para desarrollo local.
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coachsports_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:coachsports_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:coachsports_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
# "update" → Hibernate actualiza el schema sin borrar datos existentes
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
