server {
    listen 80;
    server_name localhost;

    # Directorio donde están los archivos estáticos de React (build de Vite)
    root /usr/share/nginx/html;
    index index.html;

    # Configuración clave para React SPA (Single Page Application):
    # Si el archivo no existe, redirige todo al index.html para que
    # React Router maneje las rutas del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirige las llamadas a la API al backend (Spring Boot)
    # Cualquier request a /api/* es proxiado al servicio "backend" en Docker
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para assets estáticos (imágenes, JS, CSS con hash de Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
